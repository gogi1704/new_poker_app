<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="felt" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1f9657"/>
      <stop offset="55%" stop-color="#166b40"/>
      <stop offset="100%" stop-color="#07170f"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2415"/>
      <stop offset="100%" stop-color="#1c130c"/>
    </linearGradient>
    <pattern id="suits" width="240" height="240" patternUnits="userSpaceOnUse" patternTransform="rotate(-10)">
      <text x="10" y="70" font-size="64" font-family="Georgia, serif" fill="#ffffff" fill-opacity="0.045">&#9824;</text>
      <text x="140" y="190" font-size="54" font-family="Georgia, serif" fill="#ffffff" fill-opacity="0.04">&#9829;</text>
      <text x="170" y="60" font-size="46" font-family="Georgia, serif" fill="#ffffff" fill-opacity="0.035">&#9827;</text>
      <text x="30" y="200" font-size="50" font-family="Georgia, serif" fill="#ffffff" fill-opacity="0.04">&#9830;</text>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#felt)"/>
  <rect width="1920" height="1080" fill="url(#suits)"/>

  <!-- outer rail / cushion border -->
  <rect x="0" y="0" width="1920" height="46" fill="url(#rail)" opacity="0.9"/>
  <rect x="0" y="1034" width="1920" height="46" fill="url(#rail)" opacity="0.9"/>
  <rect x="0" y="0" width="46" height="1080" fill="url(#rail)" opacity="0.9"/>
  <rect x="1874" y="0" width="46" height="1080" fill="url(#rail)" opacity="0.9"/>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
